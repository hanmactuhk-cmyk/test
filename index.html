<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Flow Studio Automation</title><link rel="stylesheet" href="style.css"></head><body><aside><h2>Flow Studio</h2><nav><button class="active">🎬 Flow Video</button><button>🎨 Flow Ảnh</button><button>👤 Nhân Vật</button><button>🔄 Workflow</button><button>📜 Log Chi Tiết</button><button>⚙ Cài Đặt</button></nav></aside><main><header><div><h1>Tạo Video Hàng Loạt</h1><span id="status">Sẵn sàng</span></div><div class="actions"><button id="import">＋ Nhập Prompt</button><button id="run">▶ Chạy</button><button id="pause">Ⅱ Tạm dừng</button><button id="stop">■ Dừng</button></div></header><section class="cards"><div class="card"><b>Tổng</b><strong id="total">0</strong></div><div class="card"><b>Đang chạy</b><strong id="running">0</strong></div><div class="card"><b>Hoàn thành</b><strong id="done">0</strong></div><div class="card"><b>Lỗi</b><strong id="errors">0</strong></div></section><section class="toolbar"><div><b>Tài khoản</b><div id="profiles"></div></div><label>Số tác vụ đồng thời <select id="concurrency"><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label>Output <input id="output" value="output"></label></section><section class="queue"><table><thead><tr><th>#</th><th>Prompt</th><th>Tài khoản</th><th>Tiến độ</th><th>Trạng thái</th><th>Video</th></tr></thead><tbody id="tbody"></tbody></table></section></main><div id="modal" class="modal"><div><button id="close">×</button><h3>Xem trước video</h3><video id="preview" controls autoplay></video></div></div><script src="app.js"></script></body></html>
