name: Voice Hn Studio Turbo - iOS native engine feasibility

on:
  workflow_dispatch:
  push:
    branches: [voice-hn-studio-turbo-ios]
    paths:
      - ".github/workflows/turbo-ios-engine-probe.yml"

permissions:
  contents: read

jobs:
  turbo-probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing native iOS project
        run: |
          python3 - <<'PY'
          import io,lzma,tarfile
          from pathlib import Path
          data=lzma.decompress(Path("voice-hn-studio/v1/source.tar.xz").read_bytes())
          Path("ios").mkdir()
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:") as ar:
              for entry in ar:
                  if entry.name.startswith("/") or ".." in Path(entry.name).parts: raise ValueError(entry.name)
              ar.extractall("ios",filter="data")
          print("iOS project items:")
          for p in Path("ios").iterdir(): print(str(p))
          PY
      - name: Fetch genuine Turbo native C++ inference engine
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/dduongtrandai/VieNeu-TTS.cpp.git cpp
          test -s cpp/src/vieneu/vieneu_tts.h
          test -s cpp/CMakeLists.txt
          test -s cpp/third_party/llama.cpp/CMakeLists.txt
      - name: Discover iOS ONNX Runtime linkage in existing app
        run: |
          set -eu
          echo "==== Podfile ===="
          cat ios/Podfile
          echo "==== Xcode package files ===="
          find ios -maxdepth 4 \( -iname '*onnx*' -o -name '*.xcframework' -o -name 'project.yml' \) -print | head -70
          echo "==== Native dependency manifest ===="
          grep -nE 'target_link_libraries|VIENEU_V3_ONNX|add_library|find_library' cpp/CMakeLists.txt | head -45
      - name: Install iOS toolchain and ONNX Runtime pod
        run: |
          set -euo pipefail
          brew install xcodegen cocoapods
          mkdir -p ios/Models ios/Data
          cd ios
          xcodegen generate
          pod install
          echo "==== Native ONNX Runtime iOS libraries ===="
          find Pods \( -iname '*onnx*' -o -name '*.xcframework' \) | head -60
          echo "==== iOS ONNX binaries ===="
          find Pods \( -iname '*.a' -o -name '*.framework' \) | head -60
          echo "==== ONNX C API headers ===="
          find Pods \( -name onnxruntime_c_api.h -o -name onnxruntime_cxx_api.h \)
      - name: Compile true Turbo C++ engine for iPhone arm64
        run: |
          set -euo pipefail
          ORT="$(pwd)/ios/Pods/onnxruntime-c/onnxruntime.xcframework/ios-arm64/onnxruntime.framework"
          test -s "$ORT/onnxruntime"
          file "$ORT/onnxruntime"
          mkdir -p ort-ios/include ort-ios/lib
          cp -R "$ORT/Headers/." ort-ios/include/
          cp "$ORT/onnxruntime" ort-ios/lib/libonnxruntime.a
          cmake -S cpp -B cpp/build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=NEVER \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DVIENEU_NATIVE_BACKEND=cpu \
            -DVIENEU_PORTABLE_CPU=ON \
            -DONNXRUNTIME_ROOT="$(pwd)/ort-ios" \
            -DBUILD_TESTING=OFF
          cmake --build cpp/build-ios --config Release \
            --target vieneu-tts-core --parallel 4 -- CODE_SIGNING_ALLOWED=NO
          test -s cpp/build-ios/Release/libvieneu-tts-core.a
          file cpp/build-ios/Release/libvieneu-tts-core.a
      - name: Inspect model availability and sizes
        run: |
          python3 -m venv .probevenv
          .probevenv/bin/pip install -q 'huggingface_hub>=0.30,<2'
          .probevenv/bin/python - <<'PY'
          from huggingface_hub import HfApi
          repo="pnnbao-ump/VieNeu-TTS-v3-Turbo"
          files=HfApi().list_repo_tree(repo,recursive=True)
          print("Genuine Turbo ONNX artifacts:")
          for e in files:
              if hasattr(e,"size") and ("/" in e.path or e.path.endswith(".onnx")):
                  print(e.path, e.size)
          PY
      - name: Report
        run: |
          echo 'Native Turbo C++ project and iOS app structure verified.'
          echo 'This probe DOES NOT claim an iPhone IPA or successful speech inference.'
